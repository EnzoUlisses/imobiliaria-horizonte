<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos - Imobiliária Horizonte</title>
    <meta name="description" content="Entre em contato com a Imobiliária Horizonte. Tire dúvidas sobre aluguel, compra ou anúncio de imóveis em São Luís - MA.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html#imoveis">Alugar</a></li>
                <li><a href="../index.html#imoveis">Comprar</a></li>
                <li><a href="#">Anunciar</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
        <h2>Entre em contato</h2>
        <form>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999">

            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto">
            <option value="">Selecione um assunto</option>
            <option value="aluguel">Quero alugar um imóvel</option>
            <option value="compra">Quero comprar um imóvel</option>
            <option value="anunciar">Quero anunciar um imóvel</option>
            <option value="duvida">Dúvidas gerais</option>
            </select>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..."></textarea>
            <button type="submit" class="btn">Enviar mensagem</button>
        </form>
    </section>
    </main>
    <footer>&copy; Imobiliária Horizonte. CRECI-MA J23.455</footer>
</body>
</html>
